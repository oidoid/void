name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  all:
    name: Test All
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - parallel:
          - name: Set Up Go
            uses: actions/setup-go@v7.0.0
            with:
              go-version-file: go.mod
              cache-dependency-path: go.sum
          - name: Set Up Bun
            # exact canary builds are published to npm but not GitHub releases.
            # to-do: switch to oven-sh/setup-bun once a stable release has `bun lint`.
            run: |
              mkdir --parents "$HOME/.bun/bin"
              curl --fail --location --silent --show-error "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-$(cat .bun-version).tgz" |
                tar --extract --gzip --directory "$HOME/.bun/bin" --strip-components=2 package/bin/bun
              echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - parallel:
          - name: Install Go Dependencies
            run: go mod download
          - name: Install Bun Dependencies
            run: bun install --frozen-lockfile

      - parallel:
          - name: Test Go Format
            run: make test-fmt-go
          - name: Test Module Format
            run: make test-fmt-mod
          - name: Test Web Format
            run: make test-fmt-web
          - name: Lint Critic
            run: make lint-critic
          - name: Lint Static
            run: make lint-static
          - name: Lint Vet
            run: make lint-vet
          - name: Lint Web
            run: make lint-web
          - name: Test Go
            run: make test-go
          - name: Test Web
            run: make test-web
          - name: Typecheck Web
            run: make typecheck-web
          - name: Build Go Commands
            run: make build-cmd
